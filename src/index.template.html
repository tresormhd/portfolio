<!doctype html>
<html lang="fr" data-photo="{{photo}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="author" content="Mohamed Tresor ZAN-BI" />
  <meta name="theme-color" content="#F7931E" />
  <link rel="canonical" href="{{siteUrl}}/" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mohamed Tresor ZAN-BI" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="{{siteUrl}}/" />
  <meta property="og:image" content="{{siteUrl}}/{{ogImage}}" />
  <meta property="og:locale" content="{{ogLocale}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{title}}" />
  <meta name="twitter:description" content="{{description}}" />
  <meta name="twitter:image" content="{{siteUrl}}/{{ogImage}}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" /></noscript>
  <link rel="stylesheet" href="dist/style.css" />
  <script>document.documentElement.classList.add('js');</script>
  <script type="application/ld+json">{{jsonld}}</script>
</head>
<body>
  <div id="app">
{{app}}
  </div>
  <noscript><p style="padding:1rem;text-align:center">JavaScript is required for language switching and animations.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
